name: Build L'ISOLA NDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Verifica toolchain
        run: |
          arm-none-eabi-gcc --version | head -1
          ls "$DEVKITPRO/libnds/include/" | head

      - name: Build e installa DSWifi col gioco multigiocatore
        run: |
          git clone --depth 1 https://github.com/BlocksDS/dswifi.git /tmp/dswifi || \
          git clone --depth 1 https://codeberg.org/BlocksDS/dswifi.git /tmp/dswifi
          calico="$(find "$DEVKITPRO" -name 'calico.h' 2>/dev/null | head -1)"
          if [ -n "$calico" ]; then extra=$(dirname "$calico"); else extra="$DEVKITPRO/libnds/include"; fi
          cd /tmp/dswifi
          make -f Makefile.arm9 \
            ARM_NONE_EABI_PATH="$DEVKITARM/bin/" \
            LIBDIRS="$DEVKITPRO/libnds" \
            INCLUDEDIRS="include source $extra"
          cp lib/libdswifi9_noip.a "$DEVKITPRO/libnds/lib/libdswifi9.a"
          cp include/dswifi9.h include/dswifi_common.h include/dswifi_version.h \
            "$DEVKITPRO/libnds/include/"

      - name: Compila LISOLA.nds
        run: |
          make clean
          make

      - name: Controlla l'output
        run: ls -la LISOLA.nds LISOLA.elf

      - uses: actions/upload-artifact@v4
        with:
          name: LISOLA.nds
          path: LISOLA.nds
          if-no-files-found: error
