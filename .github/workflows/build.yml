name: Build L'ISOLA NDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Verifica toolchain
        run: |
          arm-none-eabi-gcc --version | head -1
          ls "$DEVKITPRO/libnds/include/" | head

      - name: Installa DSWifi col supporto multigiocatore
        run: |
          git clone --depth 1 https://github.com/BlocksDS/dswifi.git /tmp/dswifi || \
          git clone --depth 1 https://codeberg.org/BlocksDS/dswifi.git /tmp/dswifi
          cd /tmp/dswifi
          make -j2 all
          make install

      - name: Compila LISOLA.nds
        run: |
          make clean
          make

      - name: Controlla l'output
        run: ls -la LISOLA.nds LISOLA.elf

      - uses: actions/upload-artifact@v4
        with:
          name: LISOLA.nds
          path: LISOLA.nds
          if-no-files-found: error
