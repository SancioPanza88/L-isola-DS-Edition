name: Build L'ISOLA NDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4

      - name: Verifica toolchain
        run: |
          arm-none-eabi-gcc --version | head -1
          ls "$DEVKITPRO/libnds/include/" | head

      - name: Build e installa DSWifi col gioco multigiocatore
        run: |
          git clone --depth 1 https://github.com/BlocksDS/dswifi.git /tmp/dswifi || \
          git clone --depth 1 https://codeberg.org/BlocksDS/dswifi.git /tmp/dswifi
          git clone --depth 1 https://github.com/BlocksDS/libnds.git /tmp/bds-libnds
          # La fork BlocksDS richiede il suo SDK nativo (cothread, libndsCrash,
          # cp15_asm.h): gli header BlocksDS vanno PRIMA di quelli devkitPro.
          # L'enum WIFI_SYNC della fork non collide col fifocommon.h di BlocksDS.
          cd /tmp/dswifi
          make -f Makefile.arm9 \
            ARM_NONE_EABI_PATH="$DEVKITARM/bin/" \
            INCLUDEDIRS="include source /tmp/bds-libnds/include $DEVKITPRO/libnds/include"
          cp lib/libdswifi9_noip.a "$DEVKITPRO/libnds/lib/libdswifi9.a"
          cp include/dswifi9.h include/dswifi_common.h include/dswifi_version.h \
            "$DEVKITPRO/libnds/include/"

      - name: Compila LISOLA.nds
        run: |
          make clean
          make

      - name: Controlla l'output
        run: ls -la LISOLA.nds LISOLA.elf

      - uses: actions/upload-artifact@v4
        with:
          name: LISOLA.nds
          path: LISOLA.nds
          if-no-files-found: error
